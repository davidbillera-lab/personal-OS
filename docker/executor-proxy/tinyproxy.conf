# Forward proxy for the executor sandbox (C6-P3).
# Deny-by-default: the allowlist file is the whole policy surface.

Port 8888

# Only the executor's internal network may use this proxy. It is NOT published
# to the host (no -p), so this is belt-and-braces against another container on
# the egress bridge borrowing it as an open relay.
Allow 172.31.250.0/24

# CONNECT tunnels only to 443. No 22/25/3389/arbitrary-port tunnelling.
ConnectPort 443

# Host allowlist. FilterDefaultDeny = everything not matched is refused.
Filter "/etc/tinyproxy/allowlist.txt"
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
FilterCaseSensitive Off

Timeout 600
MaxClients 50

# No LogFile + foreground (-d) => logs go to stdout, i.e. `docker logs`.
# Info level so refusals ("Proxying refused on filtered domain") are visible.
LogLevel Info

# Don't leak the internal client IP upstream.
DisableViaHeader Yes
