name: secret-scan
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Shallow on purpose: the leaked MCP_API_KEY (rotated) still sits, unrewritten,
        # in commit a6e373e. A full-history scan (fetch-depth: 0) would flag it on
        # every run forever. This scans only the incoming commit's file contents,
        # which still catches any new secret entering the codebase going forward.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
