name: secret-scan
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
        # Full history, on purpose: .gitleaks.toml allowlists the known, already-
        # rotated MCP_API_KEY commits by hash so this doesn't fail forever on a
        # closed incident, while still catching any new secret going forward —
        # including MC's own token shapes, which gitleaks' default rules don't know.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
