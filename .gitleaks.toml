# Test fixtures for the dispatcher's own secret-scrubbing suite (see
# decisions.md 2026-08-11) intentionally contain realistic-looking fake
# tokens — that's the thing under test. scripts/seed-vault.mjs seeds local
# dev data with placeholder credential values, not real ones.
paths = [
  '''tests/sanitize-dispatcher-path\.test\.ts''',
  '''tests/sanitize-result\.test\.ts''',
  '''scripts/seed-vault\.mjs''',
