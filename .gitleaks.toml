title = "personal-os gitleaks config"

[extend]
# Start from gitleaks' maintained default rule set (AWS, GCP, GitHub, OpenAI,
# Stripe, JWT, etc.) and layer Mission Control's own token shapes on top —
# the default rules have no idea "mc-api-key-..." or "mc_..." are secrets.
useDefault = true

[[rules]]
id = "mc-internal-api-key"
description = "Mission Control internal API key / bearer token"
regex = '''(?i)mc[-_](api[-_]?key|readonly[-_]?key|liaison[-_]?key|orchestrator[-_]?key)[-_][A-Za-z0-9_-]{10,}'''
tags = ["mission-control", "internal"]

[allowlist]
